spring.application.name=ecatlim-backend

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expirationMs=28800000

ecatlim.link=${ECATLIM_LINK}

azure.blob.connection=${BLOB_CONNECTION}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NO_REPLY_EMAIL_USERNAME}
spring.mail.password=${NO_REPLY_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

ecatlim.email.pool-size=2
ecatlim.email.queue-capacity=500

ecatlim.rate-limit.trust-forwarded-for=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
