<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Diploma de etapa</title>
    <style>
        @page { size: A4 landscape; margin: 0; }
        body { font-family: Helvetica, Arial, sans-serif; color: #3d2e24; margin: 0; }
        .frame { margin: 28pt; border: 6pt double #aa642a; padding: 8pt; height: 500pt; }
        .inner { height: 482pt; text-align: center; padding-top: 50pt; }
        .org { font-size: 11pt; letter-spacing: 2pt; color: #795221; margin: 0; }
        h1 { font-size: 44pt; color: #aa642a; margin: 30pt 0 10pt 0; }
        .small { font-size: 13pt; color: #6b5a4c; margin: 6pt 0; }
        .name { font-size: 30pt; font-weight: bold; margin: 20pt 0 12pt 0; }
        .stage { font-size: 24pt; font-weight: bold; color: #633f17; margin: 12pt 60pt 8pt 60pt; }
        .footer { margin-top: 50pt; font-size: 10pt; color: #7c9ec2; }
    </style>
</head>
<body>
<div class="frame">
    <div class="inner">
        <p class="org">ESCUELA CANARIA DE ANIMACIÓN EN EL TIEMPO LIBRE · INSIGNIA DE MADERA</p>
        <h1>Diploma</h1>
        <p class="small">Se otorga el presente diploma a</p>
        <p class="name" th:text="${fullName}">Nombre Apellidos</p>
        <p class="small">por haber completado con éxito la etapa</p>
        <p class="stage" th:text="${stageName}">Etapa</p>
        <p class="small" th:if="${completionDate != null}">Fecha: <span th:text="${completionDate}">01/01/2026</span></p>
        <p class="small">¡Enhorabuena y gracias por tu compromiso con la formación scout!</p>
        <p class="footer">#ECATLIM</p>
    </div>
</div>
</body>
</html>
